<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">1. How a student reaches PrepAtlas</title>
<desc id="desc">The browser is the window. The router is the road junction. The Pi is the small computer serving the app. Straight lines connect labeled rectangular components. Dashed lines indicate an unverified, disabled or proposed connection.</desc>

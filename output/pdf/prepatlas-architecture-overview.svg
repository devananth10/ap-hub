<text x="50" y="781" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52655F">prepatlas.app: public HTTPS and Cloudflare DNS verified October 25, 2026. This does not prove the origin is the Pi.</text>

<text x="50" y="89" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#193C37">1. How a student reaches PrepAtlas</text>
<text x="50" y="123" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52655F">The browser is the window. The router is the road junction. The Pi is the small computer serving the app.</text>

<text x="50" y="725" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52655F">Updating a container does not delete its named data volume. No automatic GitHub-to-Pi deployment is configured.</text>
<rect x="50" y="754" width="1100" height="1" fill="#8A9E96" stroke="none" stroke-width="1.3"/>
<text x="50" y="781" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52655F">The registry contains the packaged app, while GitHub contains its source history. These are different jobs.</text>
<text x="50" y="804" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52655F">Only public Supabase configuration is included in an image. Account/server secrets are supplied separately at runtime.</text>

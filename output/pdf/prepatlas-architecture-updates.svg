<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">2. How we build, save and update the app</title>
<desc id="desc">GitHub keeps the code backup. Docker packs the app. RepoFlow stores the package. The Pi downloads it. Straight lines connect labeled rectangular components. Dashed lines indicate an unverified, disabled or proposed connection.</desc>
<rect x="0" y="0" width="1200" height="850" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
<text x="50" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#217462">PREPATLAS / SYSTEM ARCHITECTURE</text>
<text x="50" y="89" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#193C37">2. How we build, save and update the app</text>
<text x="50" y="123" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52655F">GitHub keeps the code backup. Docker packs the app. RepoFlow stores the package. The Pi downloads it.</text>
<text x="50" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#217462">WRITE</text>
<text x="455" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#217462">PACKAGE</text>
<text x="860" y="175" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#217462">STORE THE PACKAGE</text>

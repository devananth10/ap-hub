<text x="68" y="587" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">devananth10/ap-hub</text>
<text x="68" y="611" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Tested code checkpoints</text>
<text x="68" y="635" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Git commit + normal push</text>
<rect x="455" y="525" width="290" height="150" fill="#EFF6F2" stroke="#217462" stroke-width="1.3"/>
<text x="473" y="557" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#193C37">Private configuration</text>
<text x="473" y="587" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Windows .env.local</text>
<text x="473" y="611" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Only public URL/key go to build</text>
<text x="473" y="635" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Secrets stay out of Git + image</text>
<rect x="860" y="525" width="290" height="150" fill="#EFF6F2" stroke="#217462" stroke-width="1.3"/>
<text x="878" y="557" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#193C37">Pi pulls and runs image</text>
<text x="878" y="587" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Docker Engine on the Pi</text>
<text x="878" y="611" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">docker pull, then replace app</text>
<text x="878" y="635" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Pi .env.local supplies runtime</text>

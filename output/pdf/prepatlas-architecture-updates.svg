<text x="878" y="291" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">prepatlas/prepatlas/</text>
<text x="878" y="315" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">studyhub-app:latest</text>

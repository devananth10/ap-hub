<text x="68" y="267" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Codex + local StudyHub code</text>
<text x="68" y="291" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Next.js / TypeScript / React</text>
<text x="68" y="315" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Tailwind designs the pages</text>
<text x="68" y="339" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Dev preview :3000 when run</text>
<text x="68" y="363" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Local Docker preview :3001</text>
<rect x="455" y="205" width="290" height="190" fill="#EFF6F2" stroke="#217462" stroke-width="1.3"/>
<text x="473" y="237" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#193C37">Docker Desktop + build</text>
<text x="473" y="267" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Dockerfile + Compose</text>
<text x="473" y="291" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">pnpm installs dependencies</text>
<text x="473" y="315" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Checks and production build</text>
<text x="473" y="339" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">AMD64 for PC; ARM64 for Pi</text>
<text x="473" y="363" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52655F">Public Supabase settings built in</text>

<text x="50" y="89" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#193C37">3. Where pages, videos and student data live</text>
<text x="50" y="123" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52655F">Three storage places have different jobs: the browser, the Pi disk, and the Supabase database.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">3. Where pages, videos and student data live</title>
<desc id="desc">Three storage places have different jobs: the browser, the Pi disk, and the Supabase database. Straight lines connect labeled rectangular components. Dashed lines indicate an unverified, disabled or proposed connection.</desc>

<text x="50" y="725" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52655F">Inside the app image: 2,640 original MCQs + 240 summaries + 319 approved video links. Video files stay on YouTube.</text>
<rect x="50" y="754" width="1100" height="1" fill="#8A9E96" stroke="none" stroke-width="1.3"/>
<text x="50" y="781" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52655F">Browser Auth SDK also refreshes sessions directly with Supabase. Server sync uses RLS, revision checks and stable attempt IDs.</text>
<text x="50" y="804" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52655F">Guest data is device/browser-specific. Import requires a choice. Unfinished Practice answers remain session-only. No paid AI API.</text>
<text x="1150" y="45" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#52655F">3 / 4</text>

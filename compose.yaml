services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      # Keep the user's existing preview on 3000 and bind locally, not publicly.
      - "127.0.0.1:${PREPATLAS_DOCKER_PORT:-3001}:3000"
    environment:
      # Match the browser address, regardless of .env.local's port-3000 origin.
      APP_ORIGIN: "http://127.0.0.1:${PREPATLAS_DOCKER_PORT:-3001}"
      APP_REGISTRATION_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      AUTH_FLOW_SECRET: ${AUTH_FLOW_SECRET:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    volumes:
      - feedback:/app/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  feedback:
